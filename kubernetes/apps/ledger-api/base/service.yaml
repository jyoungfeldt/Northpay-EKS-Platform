apiVersion: v1
kind: Service
metadata:
  name: ledger-api-stable
  namespace: ledger
spec:
  selector:
    app: ledger-api
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-api-canary
  namespace: ledger
spec:
  selector:
    app: ledger-api
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
