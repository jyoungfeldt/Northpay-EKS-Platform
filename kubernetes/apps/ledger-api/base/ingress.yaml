# AWS Load Balancer Controller provisions an ALB from this Ingress.
# ingress-nginx was retired in March 2026 — we use AWS LBC as the default for EKS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ledger-api
  namespace: ledger
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: REPLACE_WITH_ACM_CERT_ARN
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    # Canary traffic routing: Argo Rollouts controls the target group weights
    alb.ingress.kubernetes.io/actions.forward-canary: |
      {"type":"forward","forwardConfig":{"targetGroups":[
        {"serviceName":"ledger-api-stable","servicePort":"80","weight":100},
        {"serviceName":"ledger-api-canary","servicePort":"80","weight":0}
      ]}}
spec:
  rules:
    - host: api.northpay.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ledger-api-stable
                port:
                  number: 80
