apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ledger-api-db
  namespace: ledger
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: ledger-api-db
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: northpay/dev/db-credentials
        property: DATABASE_URL
