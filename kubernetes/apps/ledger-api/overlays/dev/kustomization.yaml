apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

# CI updates this image tag automatically after a successful build
images:
  - name: ledger-api
    newName: REPLACE_WITH_ECR_URI/northpay/ledger-api
    newTag: latest

patchesStrategicMerge:
  - replicas-patch.yaml
