name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/ledger-api/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/ledger-api/**"

permissions:
  id-token: write   # Required for OIDC
  contents: write   # Required for GitOps manifest commit + push

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ledger-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Lint
        run: ruff check src/

  build-and-push:
    name: Build, scan, and push
    needs: test
    runs-on: ubuntu-latest
    # Only push images from main
    if: github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_uri: ${{ steps.push_output.outputs.image_uri }}
      registry: ${{ steps.primary.outputs.registry }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker metadata (tag = git sha)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch

      # Capture the single sha-based tag for use in Trivy and downstream jobs.
      # steps.meta.outputs.tags is multi-line; we extract just the sha tag.
      - name: Resolve primary image tag
        id: primary
        run: |
          SHA_TAG=$(echo "${{ steps.meta.outputs.tags }}" | grep -v 'main' | head -n1)
          echo "tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "registry=${{ steps.login-ecr.outputs.registry }}" >> $GITHUB_OUTPUT

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: apps/ledger-api
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.primary.outputs.tag }}
          format: table
          exit-code: "1"         # Fail CI on CRITICAL vulnerabilities
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Push to ECR
        uses: docker/build-push-action@v6
        with:
          context: apps/ledger-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Output image URI
        id: push_output
        run: echo "image_uri=${{ steps.primary.outputs.tag }}" >> $GITHUB_OUTPUT

  update-gitops-manifest:
    name: Update GitOps manifest
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Update image tag in Kustomize overlay
        run: |
          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
          REGISTRY=${{ needs.build-and-push.outputs.registry }}
          cd kubernetes/apps/ledger-api/overlays/dev
          kustomize edit set image ledger-api=${REGISTRY}/${{ vars.ECR_REPOSITORY }}:${IMAGE_TAG}

      - name: Commit manifest update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/apps/ledger-api/overlays/dev/kustomization.yaml
          git commit -m "chore: update ledger-api image to ${{ needs.build-and-push.outputs.image_tag }} [skip ci]"
          git push
